name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write 
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up MSVC
      uses: microsoft/setup-msbuild@v1.3.2

    - name: Create icon file
      run: |
        echo "Creating placeholder icon file"
        New-Item -Path "usb_application.ico" -ItemType "file" -Force

    - name: Create Build Directory
      run: mkdir build

    - name: Configure with CMake
      run: |
        cd build
        cmake ..

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Run Tests
      run: |
        cd build
        ctest -C Release

    - name: Package Release
      if: github.event_name == 'workflow_dispatch' && inputs.create_release == true || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      run: |
        cd build
        cpack -C Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: usb-monitor-windows
        path: build/Release/usb_hooks.exe
        retention-days: 90

    - name: Extract version from README
      if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
      id: version
      run: |
        # Simplified version extraction that doesn't rely on grep -P (which is locale-dependent)
        VERSION=$(grep "Version:" README.md | head -n 1 | sed 's/.*Version:\*\* \([0-9.]*\).*/\1/')
        echo "Using version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create Release
      if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        files: |
          build/Release/usb_hooks.exe
          README.md
          LICENSE
        token: ${{ secrets.GITHUB_TOKEN }}
